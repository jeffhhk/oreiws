<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title id="title_title">Shared Multiple Choice</title>
</head>
<body>
  <!-- Reconnect Banner -->
  <div id="reconnectBanner" style="display:none; background: #fff4a3; padding: 1em; font-weight: bold;">
    Trying to reconnect...
  </div>

  <h1 id="title_text">Shared Multiple Choice</h1>
  <p>Select an option below. The choice will update in real-time for all users connected to this page.</p>

  <form id="choices"></form>

  <script>
    // Global references
    let ws = null;
    let reconnectInterval = null;

    // Helper to show and hide the reconnect banner
    function showReconnect() {
      const reconnect = document.getElementById('reconnectBanner');
      if (reconnect) {
        reconnect.style.display = 'block';
      }
    }


    // Define a single global event handler for form changes
    function handleFormChange(event) {
      if (event.target.name === 'choice' && ws && ws.readyState === WebSocket.OPEN) {
        console.log({
          "event": "ws.send",
          event,
          "target": event.target,
          "data": { type: 'choice', choice: event.target.value }
        });
        ws.send(JSON.stringify({ type: 'choice', choice: event.target.value }));
      } else {
        console.log({ "event": "unknown", event });
      }
    }
    function hideReconnect() {
      const reconnect = document.getElementById('reconnectBanner');
      if (reconnect) {
        reconnect.style.display = 'none';
      }
    }

    function selectFromSws(data, sws) {
      const choices = data.choices.find(r => JSON.stringify(r.sws) === JSON.stringify(sws));
      if (choices) {
        let label = choices.label
        // check all choices with a matching label
        document.querySelectorAll('input[name="choice"]').forEach(input => {
          input.checked = (input.value === label);
        });
      }
    }

    // Function to fetch config and build the page
    function fetchAndConfigure() {
      fetch('/config')
        .then(response => response.json())
        .then(data => {
          // Update titles if present in config data
          if (data['title']) {
            const title1 = document.getElementById('title_title');
            if (title1) title1.textContent = data['title'];
            const title2 = document.getElementById('title_text');
            if (title2) title2.textContent = data['title'];
          }

          // Build the form of choices
          const form = document.getElementById('choices');
          form.innerHTML = '';  // Clear out any existing choices
          data.choices.forEach(row => {
            const label = document.createElement('label');
            label.textContent = row.label;
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = 'choice';
            input.value = row.label;
            label.prepend(input);
            form.appendChild(label);
            form.appendChild(document.createElement('br'));
          });

          // Remove any existing change listener to avoid duplicates
          form.removeEventListener('change', handleFormChange);

          // Attach a single event listener for input changes
          form.addEventListener('change', handleFormChange);

          fetch('/sws')
            .then(resp => resp.json())
            .then(respSws => {
              if (respSws.event === 'OK' && respSws.sws) {
                this.selectFromSws(data, respSws.sws)
              }
            });
        })
        .catch((err) => {
          console.error('Failed to fetch config:', err);
        });
    }

    function connectWebSocket() {
      // Create a new WebSocket
      ws = new WebSocket(`ws://${location.host}`);

      // When the connection opens successfully
      ws.addEventListener('open', () => {
        console.log('WebSocket connection opened');
        hideReconnect();
        // Clear the reconnect interval if it is set
        if (reconnectInterval) {
          clearInterval(reconnectInterval);
          reconnectInterval = null;
        }
        // Re-fetch config (reconfigure) if desired
        fetchAndConfigure();
      });

      // Listen for messages from the server
      ws.addEventListener('message', (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'update') {
          // Update the displayed choice
          document.querySelectorAll('input[name="choice"]').forEach(input => {
            input.checked = (input.value === data.choice);
          });
        }
      });

      // When the connection closes
      ws.addEventListener('close', () => {
        console.log('WebSocket closed');
        showReconnect();
        // If not already trying to reconnect, set interval to try every 5 seconds
        if (!reconnectInterval) {
          reconnectInterval = setInterval(() => {
            console.log('Attempting to reconnect...');
            connectWebSocket();
          }, 5000);
        }
      });

      // If an error occurs
      ws.addEventListener('error', (error) => {
        console.log('WebSocket error:', error);
      });
    }

    // On page load, fetch config and connect the WebSocket
    window.addEventListener('DOMContentLoaded', () => {
      fetchAndConfigure();
      connectWebSocket();
    });
  </script>
</body>
</html>
